<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gameplay Team + Videos</title>
<meta property="og:title" content="24Play · Gameplay Team + Videos">
<style>
:root{color-scheme:dark;--bg:#070707}
:root[data-theme="light"]{--bg:#070707}
html,body{height:100%}
body{margin:0;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.vp{position:relative;width:100vw;height:100vh}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:#000;overflow:hidden}
.stage img{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage video{position:absolute;left:3.75%;top:39.8148%;width:14.0625%;height:44.4444%;object-fit:fill;display:block}
</style>
</head><body>
<div class="vp" id="vp"><div class="stage" id="stage">
  <img src="slide.jpg" alt="Gameplay Team + Videos: one Unity gameplay build turned into many video creatives, with the Zombiepunk top performer">
  <video src="zombiepunk.mp4" autoplay muted loop playsinline></video>
</div></div>
<script>
var vp=document.getElementById('vp'),st=document.getElementById('stage');
function fit(){var s=Math.min(vp.clientWidth/1920,vp.clientHeight/1080);st.style.transform='translate(-50%,-50%) scale('+s+')'}
addEventListener('resize',fit);fit();
var v=document.querySelector('video');var p=v.play();if(p&&p.catch)p.catch(function(){});
</script>
</body></html>
